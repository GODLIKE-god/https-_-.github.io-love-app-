<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди свою любовь</title>

    <!-- Шрифты с характером: Bebas Neue (заголовок) + Montserrat (текст) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* ============================================================
           ОБЩИЕ СТИЛИ
           ============================================================ */
        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            /* Красно-чёрный фон с несколькими слоями */
            background: #050505;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(200, 0, 0, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(120, 0, 0, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(60, 0, 0, 0.5) 0%, transparent 70%),
                linear-gradient(135deg, #0a0000 0%, #1a0000 50%, #0a0000 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Пульсирующее красное свечение по краям */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 0% 0%, rgba(255, 0, 0, 0.25), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(180, 0, 0, 0.25), transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50%      { opacity: 1; }
        }

        /* ============================================================
           ИНТЕРАКТИВНЫЙ ФОН: canvas для частиц/фигур
           ============================================================ */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================================
           КНОПКА ПРОФИЛЯ В ЛЕВОМ ВЕРХНЕМ УГЛУ
           ============================================================ */
        .top-profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.75rem 1.4rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            color: #ffb3b3;
            border-radius: 14px;
            background: linear-gradient(180deg, #2a0808 0%, #0a0000 100%);
            border: 1px solid rgba(255, 60, 90, 0.45);
            box-shadow:
                0 6px 0 #000000,
                0 8px 18px rgba(0, 0, 0, 0.7),
                0 0 25px rgba(255, 30, 60, 0.2),
                inset 0 1px 0 rgba(255, 130, 150, 0.25);
            text-shadow: 0 0 10px rgba(255, 80, 100, 0.6);
            transition: all 0.18s ease;
        }

        .top-profile-btn:hover {
            background: linear-gradient(180deg, #4a1010 0%, #1a0000 100%);
            color: #fff;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow:
                0 8px 0 #000000,
                0 10px 22px rgba(0, 0, 0, 0.75),
                0 0 45px rgba(255, 40, 70, 0.55),
                inset 0 1px 0 rgba(255, 180, 200, 0.4);
            border-color: rgba(255, 100, 130, 0.85);
        }

        .top-profile-btn:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #000000,
                0 4px 10px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 130, 150, 0.25);
        }

        .top-profile-btn i {
            font-size: 1.2rem;
        }

        /* ============================================================
           МИНИ-ВИДЖЕТ ПРОФИЛЯ (ПРАВЫЙ ВЕРХНИЙ УГОЛ)
           ============================================================ */
        .profile-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 1rem 0.55rem 0.55rem;
            background: rgba(15, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 40, 60, 0.35);
            border-radius: 50px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.7),
                0 0 25px rgba(255, 30, 60, 0.15);
            text-decoration: none;
            transition: all 0.3s ease;
            max-width: 260px;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        .profile-widget.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .profile-widget:hover {
            border-color: rgba(255, 100, 130, 0.8);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.8),
                0 0 45px rgba(255, 40, 70, 0.5);
            transform: translateY(-2px);
            text-decoration: none;
        }

        .widget-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, #3a0a0a, #1a0000);
            border: 2px solid rgba(255, 60, 90, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 1.4rem;
            box-shadow: 0 0 12px rgba(255, 30, 60, 0.5);
        }

        .widget-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .widget-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .widget-name {
            font-weight: 700;
            font-size: 0.92rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            text-shadow: 0 0 8px rgba(255, 60, 90, 0.5);
        }

        .widget-sub {
            font-size: 0.72rem;
            color: #ff9ba9;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        /* ============================================================
           ПАРЯЩИЕ 3D-СЕРДЦА (CSS)
           ============================================================ */
        .heart {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            animation: floatHeart linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 30, 60, 0.6));
        }

        .heart-shape {
            position: relative;
            width: 40px;
            height: 40px;
            transform: rotate(-45deg);
            background: linear-gradient(135deg, #ff1e3c, #a8001a);
            border-radius: 0 0 0 8px;
        }

        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: inherit;
            border-radius: 50%;
        }

        .heart-shape::before {
            top: -20px;
            left: 0;
        }

        .heart-shape::after {
            top: 0;
            left: 20px;
        }

        .heart-shape::after {
            background: radial-gradient(circle at 30% 30%, rgba(255, 200, 200, 0.9), transparent 60%), #a8001a;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-20vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕНТ
           ============================================================ */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 5;
            padding: 2rem 1rem;
            perspective: 1200px;
        }

        .hero-card {
            background: rgba(15, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 40, 60, 0.35);
            border-radius: 28px;
            padding: 3.5rem 3rem;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(255, 0, 40, 0.15),
                inset 0 1px 0 rgba(255, 100, 120, 0.2);
            max-width: 780px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 1s ease;
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 0, 40, 0.08), transparent 30%);
            animation: rotateShine 12s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateShine {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           3D-НАДПИСЬ "НАЙДИ СВОЮ ЛЮБОВЬ"
           ============================================================ */
        .love-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 9vw, 6.5rem);
            line-height: 0.95;
            letter-spacing: 4px;
            margin: 0.5rem 0 1.5rem;
            color: #ff1e3c;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            text-shadow:
                1px 1px 0 #d10020,
                2px 2px 0 #c0001d,
                3px 3px 0 #b0001a,
                4px 4px 0 #a00017,
                5px 5px 0 #900014,
                6px 6px 0 #800011,
                7px 7px 0 #70000e,
                8px 8px 0 #60000b,
                9px 9px 0 #500008,
                10px 10px 0 #400005,
                12px 12px 20px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(255, 30, 60, 0.8),
                0 0 60px rgba(255, 0, 40, 0.5),
                0 0 100px rgba(255, 0, 40, 0.3);
            animation: titlePulse 3s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .love-title::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            color: #ff6b7d;
            text-shadow:
                -1px -1px 0 #ff8a96,
                -2px -2px 10px rgba(255, 100, 120, 0.6);
            transform: translate(-2px, -2px);
            filter: blur(0.5px);
        }

        @keyframes titlePulse {
            0%, 100% {
                text-shadow:
                    1px 1px 0 #d10020, 2px 2px 0 #c0001d, 3px 3px 0 #b0001a,
                    4px 4px 0 #a00017, 5px 5px 0 #900014, 6px 6px 0 #800011,
                    7px 7px 0 #70000e, 8px 8px 0 #60000b, 9px 9px 0 #500008,
                    10px 10px 0 #400005, 12px 12px 20px rgba(0, 0, 0, 0.9),
                    0 0 30px rgba(255, 30, 60, 0.8),
                    0 0 60px rgba(255, 0, 40, 0.5),
                    0 0 100px rgba(255, 0, 40, 0.3);
            }
            50% {
                text-shadow:
                    1px 1px 0 #d10020, 2px 2px 0 #c0001d, 3px 3px 0 #b0001a,
                    4px 4px 0 #a00017, 5px 5px 0 #900014, 6px 6px 0 #800011,
                    7px 7px 0 #70000e, 8px 8px 0 #60000b, 9px 9px 0 #500008,
                    10px 10px 0 #400005, 12px 12px 20px rgba(0, 0, 0, 0.9),
                    0 0 45px rgba(255, 50, 80, 1),
                    0 0 90px rgba(255, 0, 40, 0.7),
                    0 0 140px rgba(255, 0, 40, 0.4);
            }
        }

        .title-heart {
            display: inline-block;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #ff1e3c;
            filter: drop-shadow(0 0 20px rgba(255, 30, 60, 0.9));
            animation: beat 1.2s ease-in-out infinite;
            margin-bottom: 0.5rem;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25%      { transform: scale(1.25); }
            40%      { transform: scale(0.95); }
            60%      { transform: scale(1.15); }
        }

        .hero-card p {
            font-size: 1.15rem;
            opacity: 0.85;
            margin-bottom: 2.5rem;
            color: #e8d0d0;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           3D-КНОПКИ
           ============================================================ */
        .btn-group-3d {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.9rem;
            margin-top: 0.5rem;
            position: relative;
            z-index: 2;
        }

        .btn-3d {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1.05rem 2.4rem;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
            outline: none;
            user-select: none;
        }

        /* Красная кнопка "Начать знакомиться" */
        .btn-3d-primary {
            background: linear-gradient(180deg, #ff2d4a 0%, #c0001a 100%);
            color: #fff;
            box-shadow:
                0 8px 0 #7a0010,
                0 10px 18px rgba(0, 0, 0, 0.6),
                0 0 35px rgba(255, 30, 60, 0.4),
                inset 0 1px 0 rgba(255, 180, 190, 0.5);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .btn-3d-primary:hover {
            background: linear-gradient(180deg, #ff4d67 0%, #d4001e 100%);
            color: #fff;
            text-decoration: none;
            box-shadow:
                0 8px 0 #7a0010,
                0 12px 25px rgba(0, 0, 0, 0.65),
                0 0 55px rgba(255, 40, 70, 0.7),
                inset 0 1px 0 rgba(255, 200, 210, 0.6);
        }

        .btn-3d-primary:active {
            transform: translateY(6px);
            box-shadow:
                0 2px 0 #7a0010,
                0 4px 10px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 30, 60, 0.3),
                inset 0 1px 0 rgba(255, 180, 190, 0.5);
        }

        /* Тёмная кнопка "О сайте" */
        .btn-3d-secondary {
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            color: #ff4d67;
            box-shadow:
                0 8px 0 #000000,
                0 10px 18px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 30, 60, 0.15),
                inset 0 1px 0 rgba(255, 100, 120, 0.2);
            border: 1px solid rgba(255, 40, 60, 0.4);
            text-shadow: 0 0 12px rgba(255, 40, 60, 0.6);
        }

        .btn-3d-secondary:hover {
            background: linear-gradient(180deg, #2a0a0a 0%, #0f0000 100%);
            color: #ff6b7d;
            text-decoration: none;
            box-shadow:
                0 8px 0 #000000,
                0 12px 25px rgba(0, 0, 0, 0.75),
                0 0 50px rgba(255, 40, 70, 0.4),
                inset 0 1px 0 rgba(255, 100, 120, 0.35);
            border-color: rgba(255, 60, 80, 0.7);
        }

        .btn-3d-secondary:active {
            transform: translateY(6px);
            box-shadow:
                0 2px 0 #000000,
                0 4px 10px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(255, 30, 60, 0.15),
                inset 0 1px 0 rgba(255, 100, 120, 0.2);
        }

        .btn-3d i {
            font-size: 1.3rem;
            transition: transform 0.2s ease;
        }

        .btn-3d:hover i {
            transform: scale(1.2) rotate(-8deg);
        }

        /* ============================================================
           ФУТЕР
           ============================================================ */
        footer {
            position: relative;
            z-index: 5;
            padding: 1.5rem;
            text-align: center;
        }

        footer a {
            color: #b08080;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.8;
            transition: all 0.3s ease;
            border-bottom: 1px dashed rgba(255, 40, 60, 0.4);
            padding-bottom: 2px;
        }

        footer a:hover {
            opacity: 1;
            color: #ff4d67;
            border-bottom-color: #ff1e3c;
            letter-spacing: 0.5px;
        }

        footer i {
            margin-right: 0.4rem;
            color: #ff1e3c;
        }

        /* ============================================================
           АДАПТИВНОСТЬ
           ============================================================ */
        @media (max-width: 576px) {
            .hero-card { padding: 2.5rem 1.5rem; border-radius: 22px; }
            .love-title { letter-spacing: 2px; }
            .btn-3d { font-size: 1rem; padding: 0.9rem 1.8rem; width: 100%; justify-content: center; margin: 0.35rem 0; }
            .btn-group-3d { flex-direction: column; gap: 0.6rem; }

            .top-profile-btn {
                top: 12px;
                left: 12px;
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .profile-widget {
                top: 12px;
                right: 12px;
                padding: 0.4rem 0.8rem 0.4rem 0.4rem;
                max-width: 200px;
            }

            .widget-avatar { width: 36px; height: 36px; font-size: 1.1rem; }
            .widget-name { font-size: 0.82rem; max-width: 110px; }
            .widget-sub { font-size: 0.66rem; max-width: 110px; }
        }
    </style>
</head>
<body>
    <!-- Canvas для интерактивных 3D-фигур -->
    <canvas id="bg-canvas"></canvas>

    <!-- ============================================================
         КНОПКА ПРОФИЛЯ В ЛЕВОМ ВЕРХНЕМ УГЛУ
         ============================================================ -->
    <a href="3.html" class="top-profile-btn">
        <i class="bi bi-person-circle"></i>
        Профиль
    </a>

    <!-- ============================================================
         МИНИ-ВИДЖЕТ ПРОФИЛЯ (ПРАВЫЙ ВЕРХНИЙ УГОЛ)
         Появляется только если профиль сохранён
         ============================================================ -->
    <a href="3.html" class="profile-widget" id="profileWidget">
        <div class="widget-avatar" id="widgetAvatar">
            <i class="bi bi-person" style="color: rgba(255,120,140,0.6);"></i>
        </div>
        <div class="widget-info">
            <span class="widget-name" id="widgetName">Мой профиль</span>
            <span class="widget-sub" id="widgetSub">Нажми, чтобы заполнить</span>
        </div>
    </a>

    <main>
        <div class="hero-card">
            <span class="title-heart">❤</span>
            <h1 class="love-title" data-text="Найди свою любовь">Найди свою любовь</h1>
            <p>Каждое сердце заслуживает своей истории. Начни путь к своей прямо сейчас.</p>

            <div class="btn-group-3d">
                <a href="2.html" class="btn-3d btn-3d-primary">
                    <i class="bi bi-heart-fill"></i>
                    Начать знакомиться
                </a>
                <a href="1.html" class="btn-3d btn-3d-secondary">
                    <i class="bi bi-info-circle"></i>
                    О сайте
                </a>
            </div>
        </div>
    </main>

    <footer>
        <a href="1.html">
            <i class="bi bi-heart"></i>
            Сделано с любовью
        </a>
    </footer>

    <script>
        /* ============================================================
           1. ПАРЯЩИЕ 3D-СЕРДЦА (создаются динамически)
           ============================================================ */
        (function spawnHearts() {
            const heartCount = 14;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';

                const size = 15 + Math.random() * 35;
                const left = Math.random() * 100;
                const duration = 10 + Math.random() * 15;
                const delay = Math.random() * 15;

                heart.style.left = left + 'vw';
                heart.style.animationDuration = duration + 's';
                heart.style.animationDelay = delay + 's';

                const shape = document.createElement('div');
                shape.className = 'heart-shape';
                shape.style.width = size + 'px';
                shape.style.height = size + 'px';
                shape.style.transform = `rotate(-45deg) scale(${size / 40})`;
                shape.style.transformOrigin = 'center';

                heart.appendChild(shape);
                document.body.appendChild(heart);
            }
        })();

        /* ============================================================
           2. ИНТЕРАКТИВНЫЙ CANVAS: 3D-геометрические фигуры
           ============================================================ */
        (function initCanvas() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');

            let W, H;
            const shapes = [];
            const mouse = { x: -9999, y: -9999, vx: 0, vy: 0 };

            const SHAPE_TYPES = 4;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            window.addEventListener('mousemove', (e) => {
                mouse.vx = e.clientX - mouse.x;
                mouse.vy = e.clientY - mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            window.addEventListener('mouseleave', () => {
                mouse.x = -9999;
                mouse.y = -9999;
            });

            class Shape {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.size = 20 + Math.random() * 50;
                    this.type = Math.floor(Math.random() * SHAPE_TYPES);
                    this.rot = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.015;
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = (Math.random() - 0.5) * 0.6;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.015 + Math.random() * 0.02;
                    this.hue = 350 + Math.random() * 20;
                    this.opacity = 0.25 + Math.random() * 0.45;
                    this.depth = 0.4 + Math.random() * 0.9;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rot += this.rotSpeed;
                    this.pulse += this.pulseSpeed;

                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const dist = Math.hypot(dx, dy);
                    const radius = 160;

                    if (dist < radius && dist > 0.1) {
                        const force = (radius - dist) / radius;
                        const angle = Math.atan2(dy, dx);
                        this.x += Math.cos(angle) * force * 3.5;
                        this.y += Math.sin(angle) * force * 3.5;
                    }

                    const speed = Math.hypot(mouse.vx, mouse.vy);
                    if (speed > 8) {
                        const mdx = mouse.x - this.x;
                        const mdy = mouse.y - this.y;
                        const mdist = Math.hypot(mdx, mdy);
                        if (mdist < 350) {
                            this.x += mdx * 0.008;
                            this.y += mdy * 0.008;
                        }
                    }

                    if (this.x < -this.size) this.x = W + this.size;
                    if (this.x > W + this.size) this.x = -this.size;
                    if (this.y < -this.size) this.y = H + this.size;
                    if (this.y > H + this.size) this.y = -this.size;

                    mouse.vx *= 0.92;
                    mouse.vy *= 0.92;
                }

                draw() {
                    const pulseSize = this.size * (1 + Math.sin(this.pulse) * 0.08);
                    const alpha = this.opacity * (0.8 + Math.sin(this.pulse) * 0.2);

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rot);
                    ctx.globalAlpha = alpha;

                    const layers = 6;
                    for (let i = layers; i >= 0; i--) {
                        const offset = i * 1.8;
                        const darkness = i / layers;
                        const r = Math.floor(180 * (1 - darkness * 0.9) + 40);
                        const g = Math.floor(10 * (1 - darkness));
                        const b = Math.floor(30 * (1 - darkness));

                        ctx.beginPath();
                        this.path(ctx, pulseSize);
                        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.15 + (1 - darkness) * 0.2})`;
                        ctx.translate(offset * 0.15, offset * 0.15);
                        ctx.fill();
                        ctx.translate(-offset * 0.15, -offset * 0.15);
                    }

                    ctx.beginPath();
                    this.path(ctx, pulseSize);

                    const grad = ctx.createLinearGradient(
                        -pulseSize, -pulseSize,
                        pulseSize, pulseSize
                    );
                    grad.addColorStop(0, `hsla(${this.hue}, 100%, 65%, 0.9)`);
                    grad.addColorStop(0.5, `hsla(${this.hue - 10}, 100%, 45%, 0.8)`);
                    grad.addColorStop(1, `hsla(${this.hue - 20}, 100%, 25%, 0.9)`);

                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.strokeStyle = `hsla(${this.hue}, 100%, 75%, ${0.6 + Math.sin(this.pulse) * 0.3})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    ctx.beginPath();
                    this.path(ctx, pulseSize * 0.55);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, 0.25)`;
                    ctx.fill();

                    ctx.restore();
                }

                path(c, size) {
                    const sides = this.type === 0 ? 3
                                : this.type === 1 ? 4
                                : this.type === 2 ? 6
                                : 4;

                    if (this.type === 3) {
                        c.moveTo(0, -size);
                        c.lineTo(size * 0.6, 0);
                        c.lineTo(0, size);
                        c.lineTo(-size * 0.6, 0);
                        c.closePath();
                    } else {
                        for (let i = 0; i < sides; i++) {
                            const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
                            const px = Math.cos(angle) * size;
                            const py = Math.sin(angle) * size;
                            if (i === 0) c.moveTo(px, py);
                            else c.lineTo(px, py);
                        }
                        c.closePath();
                    }
                }
            }

            const count = Math.min(22, Math.floor((W * H) / 45000));
            for (let i = 0; i < count; i++) {
                shapes.push(new Shape());
            }

            function loop() {
                ctx.clearRect(0, 0, W, H);
                shapes.forEach(s => {
                    s.update();
                    s.draw();
                });
                requestAnimationFrame(loop);
            }
            loop();

            window.addEventListener('click', (e) => {
                for (let i = 0; i < 6; i++) {
                    const s = new Shape();
                    s.x = e.clientX;
                    s.y = e.clientY;
                    s.vx = (Math.random() - 0.5) * 4;
                    s.vy = (Math.random() - 0.5) * 4;
                    s.size = 25 + Math.random() * 40;
                    shapes.push(s);
                }
                while (shapes.length > 60) shapes.shift();
            });
        })();

        /* ============================================================
           3. МИНИ-ВИДЖЕТ ПРОФИЛЯ
           Подтягиваем данные из localStorage и показываем,
           если профиль заполнен (есть имя).
           ============================================================ */
        (function initProfileWidget() {
            const STORAGE_KEYS = {
                avatar:  'love_profile_avatar',
                name:    'love_profile_name',
                about:   'love_profile_about',
                looking: 'love_profile_looking'
            };

            const widget       = document.getElementById('profileWidget');
            const widgetAvatar = document.getElementById('widgetAvatar');
            const widgetName   = document.getElementById('widgetName');
            const widgetSub    = document.getElementById('widgetSub');

            const avatar  = localStorage.getItem(STORAGE_KEYS.avatar);
            const name    = localStorage.getItem(STORAGE_KEYS.name);
            const about   = localStorage.getItem(STORAGE_KEYS.about);
            const looking = localStorage.getItem(STORAGE_KEYS.looking);

            // Если имени нет — считаем, что профиль не заполнен
            if (!name || !name.trim()) {
                // Виджет не показываем, но можно показать приглашение
                widget.classList.add('show');
                widgetName.textContent = 'Мой профиль';
                widgetSub.textContent  = 'Нажми, чтобы заполнить';

                if (avatar) {
                    renderAvatar(avatar, widgetAvatar);
                }
                return;
            }

            // Есть имя — показываем заполненный виджет
            widget.classList.add('show');
            widgetName.textContent = name;
            widgetSub.textContent  = about && about.trim()
                ? about.trim()
                : 'Нажми, чтобы дополнить профиль';

            if (avatar) {
                renderAvatar(avatar, widgetAvatar);
            }

            /* Функция отрисовки аватара */
            function renderAvatar(value, container) {
                if (!value) return;

                if (value.startsWith('emoji:')) {
                    const emoji = value.slice(6);
                    container.innerHTML = `<span style="line-height:1;">${emoji}</span>`;
                } else {
                    container.innerHTML = `<img src="${value}" alt="avatar">`;
                }
            }
        })();
    </script>
</body>

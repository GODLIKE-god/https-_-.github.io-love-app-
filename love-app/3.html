<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль — Найди свою любовь</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            background: #050505;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(200, 0, 0, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(120, 0, 0, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(60, 0, 0, 0.5) 0%, transparent 70%),
                linear-gradient(135deg, #0a0000 0%, #1a0000 50%, #0a0000 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 0% 0%, rgba(255, 0, 0, 0.22), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(180, 0, 0, 0.22), transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50%      { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           ОСНОВНАЯ КАРТОЧКА
           ============================================================ */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 5;
            padding: 2rem 1rem;
        }

        .profile-card {
            background: rgba(15, 0, 0, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 40, 60, 0.35);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.85),
                0 0 70px rgba(255, 0, 40, 0.15),
                inset 0 1px 0 rgba(255, 100, 120, 0.2);
            max-width: 780px;
            width: 100%;
            animation: fadeInUp 0.9s ease;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 0, 40, 0.06), transparent 30%);
            animation: rotateShine 14s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateShine {
            to { transform: rotate(360deg); }
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .profile-header .title-heart {
            font-size: 2.2rem;
            color: #ff1e3c;
            filter: drop-shadow(0 0 18px rgba(255, 30, 60, 0.9));
            animation: beat 1.2s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 0.3rem;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25%      { transform: scale(1.25); }
            40%      { transform: scale(0.95); }
            60%      { transform: scale(1.15); }
        }

        .profile-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            letter-spacing: 3px;
            margin: 0 0 0.5rem;
            color: #ff1e3c;
            text-transform: uppercase;
            text-shadow:
                1px 1px 0 #c0001d,
                2px 2px 0 #a00017,
                3px 3px 0 #800011,
                4px 4px 0 #60000b,
                6px 6px 12px rgba(0, 0, 0, 0.9),
                0 0 25px rgba(255, 30, 60, 0.7),
                0 0 55px rgba(255, 0, 40, 0.4);
        }

        .profile-header p {
            margin: 0;
            opacity: 0.8;
            font-size: 1rem;
            color: #e8d0d0;
        }

        /* ============================================================
           СЕКЦИИ ФОРМЫ
           ============================================================ */
        .form-section {
            margin-bottom: 2.2rem;
            position: relative;
            z-index: 1;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: #ff6b7d;
            margin-bottom: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-label i {
            font-size: 1.3rem;
        }

        /* ============================================================
           ВЫБОР АВАТАРА
           ============================================================ */
        .avatar-current {
            display: flex;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .avatar-preview {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 40, 60, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(255, 30, 60, 0.4),
                inset 0 0 20px rgba(255, 0, 40, 0.15);
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-preview .placeholder-icon {
            font-size: 3.5rem;
            color: rgba(255, 100, 120, 0.5);
        }

        /* Сетка готовых аватаров */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 0.7rem;
            margin-bottom: 1rem;
        }

        .avatar-option {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            background: linear-gradient(135deg, #2a0000, #0a0000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            transition: all 0.25s ease;
            overflow: hidden;
            padding: 0;
            position: relative;
        }

        .avatar-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-option:hover {
            transform: translateY(-3px) scale(1.05);
            border-color: rgba(255, 100, 130, 0.7);
            box-shadow: 0 8px 20px rgba(255, 30, 60, 0.4);
        }

        .avatar-option.selected {
            border-color: #ff1e3c;
            box-shadow:
                0 0 0 3px rgba(255, 30, 60, 0.4),
                0 8px 25px rgba(255, 30, 60, 0.6);
            transform: scale(1.05);
        }

        /* Эмодзи-аватары */
        .avatar-option.emoji {
            background: linear-gradient(135deg, #3a0a0a, #1a0000);
        }

        /* Кнопка загрузки своего фото */
        .upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.9rem 1.5rem;
            background: rgba(255, 255, 255, 0.06);
            border: 2px dashed rgba(255, 80, 100, 0.5);
            border-radius: 14px;
            color: #ff6b7d;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .upload-btn:hover {
            background: rgba(255, 30, 60, 0.12);
            border-color: #ff1e3c;
            color: #fff;
            transform: translateY(-2px);
        }

        .upload-btn i {
            font-size: 1.3rem;
        }

        #avatarUpload {
            display: none;
        }

        /* ============================================================
           ПОЛЯ ВВОДА
           ============================================================ */
        .field-group {
            margin-bottom: 1.3rem;
        }

        .field-label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #e8d0d0;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .field-label .required {
            color: #ff4d67;
            margin-left: 3px;
        }

        .custom-input,
        .custom-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 60, 80, 0.35);
            border-radius: 12px;
            padding: 0.85rem 1.1rem;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            resize: none;
        }

        .custom-input::placeholder,
        .custom-textarea::placeholder {
            color: rgba(255, 200, 210, 0.4);
        }

        .custom-input:focus,
        .custom-textarea:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ff1e3c;
            box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.25);
        }

        .custom-textarea {
            min-height: 100px;
            line-height: 1.6;
        }

        .char-counter {
            text-align: right;
            font-size: 0.78rem;
            color: rgba(255, 200, 210, 0.5);
            margin-top: 0.35rem;
        }

        /* ============================================================
           КНОПКИ СОХРАНЕНИЯ / ОТМЕНЫ
           ============================================================ */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 2rem;
            position: relative;
            z-index: 1;
        }

        .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 2.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            text-decoration: none;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(180deg, #ff2d4a 0%, #c0001a 100%);
            color: #fff;
            box-shadow:
                0 7px 0 #7a0010,
                0 9px 18px rgba(0, 0, 0, 0.6),
                0 0 35px rgba(255, 30, 60, 0.4),
                inset 0 1px 0 rgba(255, 180, 190, 0.5);
            transition: all 0.15s ease;
        }

        .btn-save:hover {
            background: linear-gradient(180deg, #ff4d67 0%, #d4001e 100%);
            transform: translateY(-2px);
            box-shadow:
                0 9px 0 #7a0010,
                0 12px 25px rgba(0, 0, 0, 0.65),
                0 0 55px rgba(255, 40, 70, 0.7),
                inset 0 1px 0 rgba(255, 200, 210, 0.6);
        }

        .btn-save:active {
            transform: translateY(5px);
            box-shadow:
                0 2px 0 #7a0010,
                0 4px 10px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 30, 60, 0.3),
                inset 0 1px 0 rgba(255, 180, 190, 0.5);
        }

        .btn-cancel {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            color: #ff6b7d;
            border: 1px solid rgba(255, 40, 60, 0.4);
            box-shadow:
                0 7px 0 #000000,
                0 9px 18px rgba(0, 0, 0, 0.7);
            transition: all 0.15s ease;
        }

        .btn-cancel:hover {
            background: linear-gradient(180deg, #2a0a0a 0%, #0f0000 100%);
            color: #fff;
            text-decoration: none;
            transform: translateY(-2px);
            border-color: rgba(255, 60, 80, 0.8);
            box-shadow:
                0 9px 0 #000000,
                0 12px 25px rgba(0, 0, 0, 0.75),
                0 0 40px rgba(255, 40, 70, 0.4);
        }

        .btn-cancel:active {
            transform: translateY(5px);
            box-shadow:
                0 2px 0 #000000,
                0 4px 10px rgba(0, 0, 0, 0.6);
        }

        /* ============================================================
           УВЕДОМЛЕНИЕ О СОХРАНЕНИИ
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: linear-gradient(135deg, #2a0000, #0a0000);
            border: 1px solid #4ade80;
            border-radius: 14px;
            padding: 1rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(74, 222, 128, 0.4);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            font-size: 1.5rem;
            color: #4ade80;
        }

        /* ============================================================
           ФУТЕР
           ============================================================ */
        footer {
            position: relative;
            z-index: 5;
            padding: 1.5rem;
            text-align: center;
        }

        footer a {
            color: #b08080;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.8;
            transition: all 0.3s ease;
            border-bottom: 1px dashed rgba(255, 40, 60, 0.4);
            padding-bottom: 2px;
        }

        footer a:hover {
            opacity: 1;
            color: #ff4d67;
            border-bottom-color: #ff1e3c;
        }

        footer i {
            margin-right: 0.4rem;
            color: #ff1e3c;
        }

        /* ============================================================
           АДАПТИВНОСТЬ
           ============================================================ */
        @media (max-width: 576px) {
            .profile-card { padding: 2rem 1.3rem; border-radius: 22px; }
            .avatar-preview { width: 105px; height: 105px; }
            .avatar-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
            .avatar-option { width: 60px; height: 60px; font-size: 1.6rem; }
            .btn-save, .btn-cancel {
                width: 100%;
                justify-content: center;
                padding: 0.85rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <main>
        <div class="profile-card">

            <div class="profile-header">
                <span class="title-heart">❤</span>
                <h1>Мой профиль</h1>
                <p>Расскажи о себе — и тебя увидят те, кто ищет именно тебя</p>
            </div>

            <!-- ==============================
                 АВАТАР
                 ============================== -->
            <div class="form-section">
                <div class="section-label">
                    <i class="bi bi-person-bounding-box"></i>
                    Аватар
                </div>

                <!-- Текущий аватар -->
                <div class="avatar-current">
                    <div class="avatar-preview" id="avatarPreview">
                        <i class="bi bi-person placeholder-icon"></i>
                    </div>
                </div>

                <!-- Сетка готовых аватаров -->
                <div class="avatar-grid" id="avatarGrid">
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:❤️">❤️</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🌹">🌹</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🖤">🖤</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🔥">🔥</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🌙">🌙</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:⭐">⭐</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🎭">🎭</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🌑">🌑</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🥀">🥀</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:💎">💎</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🦋">🦋</button>
                    <button type="button" class="avatar-option emoji" data-avatar="emoji:🐈‍⬛">🐈‍⬛</button>
                </div>

                <!-- Загрузка своего фото -->
                <button type="button" class="upload-btn" id="uploadTrigger">
                    <i class="bi bi-cloud-arrow-up"></i>
                    Загрузить своё фото
                </button>
                <input type="file" id="avatarUpload" accept="image/*">
            </div>

            <!-- ==============================
                 ИМЯ
                 ============================== -->
            <div class="form-section">
                <div class="section-label">
                    <i class="bi bi-person-fill"></i>
                    Имя
                </div>
                <div class="field-group">
                    <label class="field-label" for="profileName">
                        Как тебя зовут?<span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="profileName"
                        class="custom-input"
                        placeholder="Например: Алекс"
                        maxlength="40"
                    >
                    <div class="char-counter"><span id="nameCount">0</span> / 40</div>
                </div>
            </div>

            <!-- ==============================
                 О СЕБЕ
                 ============================== -->
            <div class="form-section">
                <div class="section-label">
                    <i class="bi bi-chat-heart"></i>
                    О себе
                </div>
                <div class="field-group">
                    <label class="field-label" for="profileAbout">Расскажи о себе</label>
                    <textarea
                        id="profileAbout"
                        class="custom-textarea"
                        placeholder="Чем увлекаешься, что любишь, какой ты человек..."
                        maxlength="500"
                    ></textarea>
                    <div class="char-counter"><span id="aboutCount">0</span> / 500</div>
                </div>
            </div>

            <!-- ==============================
                 КОГО ИЩУ
                 ============================== -->
            <div class="form-section">
                <div class="section-label">
                    <i class="bi bi-search-heart"></i>
                    Кого ищу
                </div>
                <div class="field-group">
                    <label class="field-label" for="profileLooking">Опиши того, кого ищешь</label>
                    <textarea
                        id="profileLooking"
                        class="custom-textarea"
                        placeholder="Какой человек тебе близок, какие качества важны..."
                        maxlength="500"
                    ></textarea>
                    <div class="char-counter"><span id="lookingCount">0</span> / 500</div>
                </div>
            </div>

            <!-- ==============================
                 КНОПКИ
                 ============================== -->
            <div class="actions">
                <a href="index.html" class="btn-cancel">
                    <i class="bi bi-x-circle"></i>
                    Отмена
                </a>
                <button type="button" class="btn-save" id="saveBtn">
                    <i class="bi bi-check-circle-fill"></i>
                    Сохранить профиль
                </button>
            </div>

        </div>
    </main>

    <footer>
        <a href="index.html">
            <i class="bi bi-heart"></i>
            Сделано с любовью
        </a>
    </footer>

    <!-- Всплывающее уведомление -->
    <div class="toast" id="toast">
        <i class="bi bi-check-circle-fill"></i>
        <span>Профиль сохранён!</span>
    </div>

    <script>
        /* ============================================================
           КЛЮЧИ ХРАНИЛИЩА
           ============================================================ */
        const STORAGE_KEYS = {
            avatar:  'love_profile_avatar',   // "emoji:❤️" или data URL
            name:    'love_profile_name',
            about:   'love_profile_about',
            looking: 'love_profile_looking'
        };

        /* ============================================================
           ССЫЛКИ НА ЭЛЕМЕНТЫ
           ============================================================ */
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarGrid    = document.getElementById('avatarGrid');
        const uploadBtn     = document.getElementById('uploadTrigger');
        const uploadInput   = document.getElementById('avatarUpload');
        const nameInput     = document.getElementById('profileName');
        const aboutInput    = document.getElementById('profileAbout');
        const lookingInput  = document.getElementById('profileLooking');
        const nameCount     = document.getElementById('nameCount');
        const aboutCount    = document.getElementById('aboutCount');
        const lookingCount  = document.getElementById('lookingCount');
        const saveBtn       = document.getElementById('saveBtn');
        const toast         = document.getElementById('toast');

        /* Текущее выбранное значение аватара */
        let currentAvatar = null;

        /* ============================================================
           ЗАГРУЗКА СОХРАНЁННЫХ ДАННЫХ
           ============================================================ */
        function loadProfile() {
            const savedAvatar  = localStorage.getItem(STORAGE_KEYS.avatar);
            const savedName    = localStorage.getItem(STORAGE_KEYS.name)    || '';
            const savedAbout   = localStorage.getItem(STORAGE_KEYS.about)   || '';
            const savedLooking = localStorage.getItem(STORAGE_KEYS.looking) || '';

            nameInput.value    = savedName;
            aboutInput.value   = savedAbout;
            lookingInput.value = savedLooking;

            updateCounters();

            if (savedAvatar) {
                setAvatar(savedAvatar, false);
            }
        }

        /* ============================================================
           ОТОБРАЖЕНИЕ АВАТАРА В БОЛЬШОМ КРУГЕ
           ============================================================ */
        function renderAvatarPreview(value) {
            if (!value) {
                avatarPreview.innerHTML = '<i class="bi bi-person placeholder-icon"></i>';
                return;
            }

            if (value.startsWith('emoji:')) {
                const emoji = value.slice(6);
                avatarPreview.innerHTML = `<span style="font-size:4rem;line-height:1;">${emoji}</span>`;
            } else {
                // Это URL или data URL картинки
                avatarPreview.innerHTML = `<img src="${value}" alt="avatar">`;
            }
        }

        /* ============================================================
           УСТАНОВКА АВАТАРА (из сетки или из файла)
           ============================================================ */
        function setAvatar(value, markSelected = true) {
            currentAvatar = value;
            renderAvatarPreview(value);

            // Обновляем подсветку выбранного аватара в сетке
            document.querySelectorAll('.avatar-option').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.avatar === value);
            });
        }

        /* ============================================================
           ОБРАБОТКА КЛИКОВ ПО ГОТОВЫМ АВАТАРАМ
           ============================================================ */
        avatarGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('.avatar-option');
            if (!btn) return;

            setAvatar(btn.dataset.avatar, true);
        });

        /* ============================================================
           ЗАГРУЗКА СВОЕГО ФОТО
           ============================================================ */
        uploadBtn.addEventListener('click', () => uploadInput.click());

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Пожалуйста, выберите изображение.');
                return;
            }

            // Проверка размера (не больше 3 МБ, чтобы не перегружать localStorage)
            if (file.size > 3 * 1024 * 1024) {
                alert('Файл слишком большой. Пожалуйста, выберите фото до 3 МБ.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                // К сожалению, data URL большой картинки может не влезть в localStorage.
                // Поэтому сжимаем через canvas.
                compressImage(event.target.result, 256, (compressed) => {
                    setAvatar(compressed, false);
                    // Снимаем выделение с эмодзи-сетки
                    document.querySelectorAll('.avatar-option').forEach(b => b.classList.remove('selected'));
                });
            };
            reader.readAsDataURL(file);
        });

        /* ============================================================
           СЖАТИЕ КАРТИНКИ ЧЕРЕЗ CANVAS (256x256, JPEG ~0.85)
           ============================================================ */
        function compressImage(dataUrl, maxSize, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width;
                let h = img.height;

                // Обрезаем до квадрата
                const side = Math.min(w, h);
                const sx = (w - side) / 2;
                const sy = (h - side) / 2;

                canvas.width = maxSize;
                canvas.height = maxSize;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);

                callback(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.src = dataUrl;
        }

        /* ============================================================
           СЧЁТЧИКИ СИМВОЛОВ
           ============================================================ */
        function updateCounters() {
            nameCount.textContent    = nameInput.value.length;
            aboutCount.textContent   = aboutInput.value.length;
            lookingCount.textContent = lookingInput.value.length;
        }

        nameInput.addEventListener('input', updateCounters);
        aboutInput.addEventListener('input', updateCounters);
        lookingInput.addEventListener('input', updateCounters);

        /* ============================================================
           СОХРАНЕНИЕ ПРОФИЛЯ
           ============================================================ */
        saveBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();

            if (!name) {
                nameInput.focus();
                nameInput.style.borderColor = '#f87171';
                nameInput.style.boxShadow = '0 0 0 3px rgba(248,113,113,0.35)';
                setTimeout(() => {
                    nameInput.style.borderColor = '';
                    nameInput.style.boxShadow = '';
                }, 1500);
                alert('Пожалуйста, укажи своё имя.');
                return;
            }

            // Сохраняем всё в localStorage
            if (currentAvatar) {
                localStorage.setItem(STORAGE_KEYS.avatar, currentAvatar);
            } else {
                localStorage.removeItem(STORAGE_KEYS.avatar);
            }
            localStorage.setItem(STORAGE_KEYS.name,    name);
            localStorage.setItem(STORAGE_KEYS.about,   aboutInput.value.trim());
            localStorage.setItem(STORAGE_KEYS.looking, lookingInput.value.trim());

            showToast('Профиль сохранён!');

            // Через 1.2 сек возвращаемся на главную
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        });

        /* ============================================================
           УВЕДОМЛЕНИЕ
           ============================================================ */
        let toastTimer = null;
        function showToast(text) {
            toast.querySelector('span').textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        /* ============================================================
           СТАРТ
           ============================================================ */
        loadProfile();
    </script>

</body>
</html>
